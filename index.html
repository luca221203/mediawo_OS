<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mediawo OS</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mw-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#171514">
<link rel="stylesheet" href="css/app.css?v=5">
</head>
<body>

<section class="login" id="login" hidden>
  <form id="loginForm">
    <img src="img/logo.png" alt="Mediawo">
    <h2>Anmelden</h2>
    <div class="stack" style="gap:12px">
      <label class="f">E-Mail<input name="email" type="email" autocomplete="username" required></label>
      <label class="f">Passwort<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Anmelden</button>
      <button class="btn link" type="button" id="pwForgot">Passwort vergessen?</button>
    </div>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><img src="img/logo.png" alt="Mediawo"></div>
    <div class="demo-badge" id="demoBadge" hidden>Demo-Modus: Beispieldaten, nichts wird gespeichert.</div>
    <nav class="nav" id="nav">
      <button data-view="start">Übersicht</button>
      <button data-view="rechnungen">Rechnungen <span class="count" id="navOverdue" hidden></span></button>
      <button data-view="kunden">Kunden</button>
      <button data-view="leistungen">Leistungen</button>
      <button data-view="einstellungen">Einstellungen</button>
      <button data-view="neu" class="new">Neue Rechnung</button>
    </nav>
    <div class="ablage" id="ablageBox"></div>
    <div class="user"><span id="userMail"></span>
      <div class="btn-row"><button class="btn small" id="pwChange">Passwort ändern</button><button class="btn small" id="logout">Abmelden</button><button class="btn small icon" id="themeToggle" title="Hell / Dunkel umschalten" aria-label="Hell / Dunkel umschalten"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button></div></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<div class="menu" id="menu" role="menu" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script src="vendor/supabase.js?v=5"></script>
<script src="vendor/jspdf.umd.min.js?v=5"></script>
<script src="vendor/pdf-fonts.js?v=5"></script>
<script src="js/config.js?v=5"></script>
<script src="js/db.js?v=5"></script>
<script src="js/doc.js?v=5"></script>
<script src="js/pdf.js?v=5"></script>
<script src="js/ablage.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
